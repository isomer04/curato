name: 🐛 Bug Report
description: Report a reproducible bug to help us improve the project
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible — it helps us reproduce and fix issues faster.

  - type: dropdown
    id: role
    attributes:
      label: Affected Role
      description: Which user role does this bug affect?
      options:
        - Patient
        - Doctor
        - Admin
        - All roles
        - Not role-specific
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I click X on the Y page, Z happens instead of..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide unambiguous steps so we can reproduce the behavior.
      placeholder: |
        1. Log in as ...
        2. Navigate to ...
        3. Click on ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include any error messages shown in the UI.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - macOS Sequoia (15)
        - macOS Sonoma (14)
        - macOS Ventura (13)
        - Ubuntu / Debian
        - Other Linux
        - iOS
        - Android
        - Other
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true

  - type: input
    id: browser_version
    attributes:
      label: Browser Version
      placeholder: "e.g. 125.0.6422.112"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs & Error Messages
      description: |
        Paste any relevant output here. Check both:
        - Browser console (F12 → Console tab)
        - Backend logs if you have access (`backend/logs/error.log`)
      render: text
      placeholder: "(paste logs here)"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Video
      description: If applicable, attach screenshots or a screen recording.
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Possible Solution
      description: Optional — if you have a suggestion on how to fix this.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, related issues, or notes.
    validations:
      required: false
