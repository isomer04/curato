name: 🚀 Feature Request
description: Suggest an idea or improvement for this project
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe it clearly so we can evaluate and prioritize it.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature you are proposing.
      placeholder: "I would like to be able to..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem It Solves
      description: Is this feature request related to a problem? Describe what frustrates you or what is currently missing.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the application does this feature relate to?
      options:
        - Patient Portal
        - Doctor Portal
        - Admin Portal
        - Authentication / MFA
        - Messaging
        - Notifications
        - API / Backend
        - Database / Migrations
        - CI / DevOps
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or approaches you have considered.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What must be true for this feature to be considered done?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / UI Sketches
      description: If applicable, attach screenshots or mockups of the proposed interface.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, references, or related issues.
    validations:
      required: false
